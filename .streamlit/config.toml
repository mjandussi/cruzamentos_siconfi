[theme]
base = "dark"
primaryColor = "#F59E0B"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#161B22"
textColor = "#F8FAFC"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# A navegação do produto já existe no cabeçalho. A sidebar fica livre para o
# progresso contextual da validação, sem repetir o menu automático de páginas.
showSidebarNavigation = false
